<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="nm-maskable-title">
  <title id="nm-maskable-title">NeuroMesh</title>
  <!--
    The MASKABLE variant of favicon.svg, for `purpose: "maskable"` in
    site.webmanifest.

    An installing OS crops a maskable icon to whatever shape it likes — a
    circle, a squircle, a rounded square — and only the central 80% (a circle
    of radius 40% about the centre) is guaranteed to survive. favicon.svg's
    hexagon spans the full width and would lose its top and bottom points to
    that crop, so this file exists rather than declaring one icon as both.

    Differences from favicon.svg, and only these:
      - the plate is a full-bleed square (the OS supplies the corner shape),
      - the glyph is scaled to ~66% and centred, comfortably inside the safe
        circle,
      - the palette and the shapes are otherwise identical.
  -->
  <style>
    :root {
      --plate: #eef3fb;
      --frame: #0b5fa8;
      --link: #0b5fa8;
      --node-a: #0b5fa8;
      --node-b: #0a6e80;
      --core: #7326c4;
      --core-ring: #eef3fb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --plate: #050a14;
        --frame: #4facfe;
        --link: #4facfe;
        --node-a: #4facfe;
        --node-b: #06b6d4;
        --core: #a855f7;
        --core-ring: #050a14;
      }
    }

    .plate {
      fill: var(--plate);
    }

    .frame {
      fill: none;
      stroke: var(--frame);
      stroke-width: 1.8;
      stroke-linejoin: round;
      opacity: 0.9;
    }

    .link {
      fill: none;
      stroke: var(--link);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.55;
    }

    .node-a {
      fill: var(--node-a);
    }

    .node-b {
      fill: var(--node-b);
    }

    .core {
      fill: var(--core);
      stroke: var(--core-ring);
      stroke-width: 1.2;
    }
  </style>

  <rect class="plate" width="32" height="32" />

  <!-- 0.66 scale about the centre keeps every point inside the 40%-radius
       safe circle on any crop shape. -->
  <g transform="translate(16 16) scale(0.66) translate(-16 -16)">
    <polygon class="frame" points="16,2.6 28.2,9.3 28.2,22.7 16,29.4 3.8,22.7 3.8,9.3" />
    <path class="link" d="M16 8.4 L24 21 L8 21 Z M16 8.4 V16 M8 21 L16 16 M24 21 L16 16" />
    <circle class="node-a" cx="16" cy="8.4" r="2.5" />
    <circle class="node-b" cx="8" cy="21" r="2.5" />
    <circle class="node-b" cx="24" cy="21" r="2.5" />
    <circle class="core" cx="16" cy="16" r="3.2" />
  </g>
</svg>
