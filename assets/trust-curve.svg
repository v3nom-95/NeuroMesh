<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500"
     role="img" aria-labelledby="nmt-t nmt-d" preserveAspectRatio="xMidYMid meet">
  <title id="nmt-t">NeuroMesh time decay</title>
  <desc id="nmt-d">Two panels. Panel A, implemented: the off-chain retrieval recency weight, two to the power minus age over a 180 day half-life, falling from 1.00 at day 0 to 0.50 at day 180 and 0.0625 at day 720. Panel B: the on-chain DecayMath decay factor, a staircase quantised to one sixteenth of a half-life, plotted against the true exponential curve. Because the exponent is floored, the staircase sits above the true curve by up to 4.43 percent, so scores decay more slowly than documented.</desc>
  <defs>
    <linearGradient id="nmt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020c1b"/>
      <stop offset="100%" stop-color="#03080f"/>
    </linearGradient>
  </defs>

