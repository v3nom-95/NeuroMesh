<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"
     role="img" aria-labelledby="nma-t nma-d" preserveAspectRatio="xMidYMid meet">
  <title id="nma-t">NeuroMesh layered architecture</title>
  <desc id="nma-d">Five stacked layers. L1 Clients: the dashboard in public, scripts/simulate.js and any HTTP client. L2 HTTP API in server.js on Express 5: helmet and cors, rate limiting, zod validation, the /api/v1 routes and pino-http logging. L3 Services, one module per route group: memories, agents, reputation, semantic and jobs. L4 Protocol core under src/protocol: envelope, keys, eip712, projection and similarity. L5 External: Xenova ONNX models, Pinata IPFS, a Sepolia RPC and the Solidity contracts. A dashed cross-cutting rail on the right holds pino structured logs, the prom-client metrics endpoint, the healthz and readyz probes and the Docker node 22 slim image.</desc>
