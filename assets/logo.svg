<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lg1" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
    <radialGradient id="lg2" cx="60%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hex">
      <polygon points="60,4 111,31 111,89 60,116 9,89 9,31"/>
    </clipPath>
  </defs>

  <!-- Hexagonal background -->
  <polygon points="60,4 111,31 111,89 60,116 9,89 9,31" fill="url(#lg1)" opacity="0.15"/>
  <polygon points="60,4 111,31 111,89 60,116 9,89 9,31" fill="none" stroke="url(#lg1)" stroke-width="2"/>

  <!-- Inner hex -->
  <polygon points="60,18 97,39 97,81 60,102 23,81 23,39" fill="none" stroke="#4facfe" stroke-width="1" opacity="0.4"/>

  <!-- Neural network nodes -->
  <!-- Centre -->
  <circle cx="60" cy="60" r="7" fill="url(#lg1)" filter="url(#glow2)"/>
  <!-- Outer ring nodes -->
  <circle cx="60" cy="28" r="5" fill="#4facfe" filter="url(#glow)"/>
  <circle cx="88" cy="44" r="5" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="88" cy="76" r="5" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="60" cy="92" r="5" fill="#4facfe" filter="url(#glow)"/>
  <circle cx="32" cy="76" r="5" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="32" cy="44" r="5" fill="#06b6d4" filter="url(#glow)"/>

  <!-- Connections centre to outer -->
  <g stroke="url(#lg1)" stroke-width="1.2" opacity="0.7">
    <line x1="60" y1="53" x2="60" y2="33"/>
    <line x1="66" y1="56" x2="83" y2="47"/>
    <line x1="66" y1="64" x2="83" y2="73"/>
    <line x1="60" y1="67" x2="60" y2="87"/>
    <line x1="54" y1="64" x2="37" y2="73"/>
    <line x1="54" y1="56" x2="37" y2="47"/>
  </g>

  <!-- Connections outer ring -->
  <g stroke="#4facfe" stroke-width="0.8" opacity="0.35">
    <line x1="60" y1="28" x2="88" y2="44"/>
    <line x1="88" y1="44" x2="88" y2="76"/>
    <line x1="88" y1="76" x2="60" y2="92"/>
    <line x1="60" y1="92" x2="32" y2="76"/>
    <line x1="32" y1="76" x2="32" y2="44"/>
    <line x1="32" y1="44" x2="60" y2="28"/>
  </g>

  <!-- Animated pulse on centre node -->
  <circle cx="60" cy="60" r="7" fill="none" stroke="#4facfe" stroke-width="1.5">
    <animate attributeName="r" values="7;14;7" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
