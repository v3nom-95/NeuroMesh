<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep dark Sui-inspired background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020c1b"/>
      <stop offset="50%" stop-color="#040d21"/>
      <stop offset="100%" stop-color="#030a18"/>
    </linearGradient>

    <!-- Cyan glow blob -->
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple glow blob -->
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue glow blob -->
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Subtitle gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Node glow filter -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Strong glow -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- Sui-style floating liquid blobs -->
  <!-- Blob top-right cyan -->
  <ellipse cx="980" cy="80" rx="280" ry="200" fill="url(#blob1)">
    <animateTransform attributeName="transform" type="translate" values="0,0;20,-15;0,0" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Blob bottom-left purple -->
  <ellipse cx="220" cy="280" rx="320" ry="180" fill="url(#blob2)">
    <animateTransform attributeName="transform" type="translate" values="0,0;-15,10;0,0" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Blob centre deep blue -->
  <ellipse cx="600" cy="170" rx="350" ry="200" fill="url(#blob3)">
    <animateTransform attributeName="transform" type="translate" values="0,0;10,8;0,0" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ═══ GRID DOT PATTERN (Sui-style) ═══ -->
  <g fill="#4facfe" opacity="0.07">
    <!-- Row 1 -->
    <circle cx="40" cy="40" r="1.5"/><circle cx="80" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/>
    <circle cx="160" cy="40" r="1.5"/><circle cx="200" cy="40" r="1.5"/><circle cx="240" cy="40" r="1.5"/>
    <circle cx="280" cy="40" r="1.5"/><circle cx="320" cy="40" r="1.5"/><circle cx="360" cy="40" r="1.5"/>
    <circle cx="400" cy="40" r="1.5"/><circle cx="440" cy="40" r="1.5"/><circle cx="480" cy="40" r="1.5"/>
    <circle cx="720" cy="40" r="1.5"/><circle cx="760" cy="40" r="1.5"/><circle cx="800" cy="40" r="1.5"/>
    <circle cx="840" cy="40" r="1.5"/><circle cx="880" cy="40" r="1.5"/><circle cx="920" cy="40" r="1.5"/>
    <circle cx="960" cy="40" r="1.5"/><circle cx="1000" cy="40" r="1.5"/><circle cx="1040" cy="40" r="1.5"/>
    <circle cx="1080" cy="40" r="1.5"/><circle cx="1120" cy="40" r="1.5"/><circle cx="1160" cy="40" r="1.5"/>
    <!-- Row 2 -->
    <circle cx="40" cy="80" r="1.5"/><circle cx="80" cy="80" r="1.5"/><circle cx="120" cy="80" r="1.5"/>
    <circle cx="160" cy="80" r="1.5"/><circle cx="200" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/>
    <circle cx="880" cy="80" r="1.5"/><circle cx="920" cy="80" r="1.5"/><circle cx="960" cy="80" r="1.5"/>
    <circle cx="1000" cy="80" r="1.5"/><circle cx="1040" cy="80" r="1.5"/><circle cx="1080" cy="80" r="1.5"/>
    <circle cx="1120" cy="80" r="1.5"/><circle cx="1160" cy="80" r="1.5"/>
    <!-- Row 3 -->
    <circle cx="40" cy="120" r="1.5"/><circle cx="80" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/>
    <circle cx="1080" cy="120" r="1.5"/><circle cx="1120" cy="120" r="1.5"/><circle cx="1160" cy="120" r="1.5"/>
    <!-- Row 5 -->
    <circle cx="40" cy="200" r="1.5"/><circle cx="80" cy="200" r="1.5"/>
    <circle cx="1120" cy="200" r="1.5"/><circle cx="1160" cy="200" r="1.5"/>
    <!-- Row 6 -->
    <circle cx="40" cy="240" r="1.5"/><circle cx="80" cy="240" r="1.5"/><circle cx="120" cy="240" r="1.5"/>
    <circle cx="1080" cy="240" r="1.5"/><circle cx="1120" cy="240" r="1.5"/><circle cx="1160" cy="240" r="1.5"/>
    <!-- Row 7 -->
    <circle cx="40" cy="280" r="1.5"/><circle cx="80" cy="280" r="1.5"/><circle cx="120" cy="280" r="1.5"/>
    <circle cx="160" cy="280" r="1.5"/><circle cx="200" cy="280" r="1.5"/>
    <circle cx="1000" cy="280" r="1.5"/><circle cx="1040" cy="280" r="1.5"/>
    <circle cx="1080" cy="280" r="1.5"/><circle cx="1120" cy="280" r="1.5"/><circle cx="1160" cy="280" r="1.5"/>
    <!-- Row 8 -->
    <circle cx="40" cy="320" r="1.5"/><circle cx="80" cy="320" r="1.5"/><circle cx="120" cy="320" r="1.5"/>
    <circle cx="160" cy="320" r="1.5"/><circle cx="200" cy="320" r="1.5"/><circle cx="240" cy="320" r="1.5"/>
    <circle cx="280" cy="320" r="1.5"/><circle cx="320" cy="320" r="1.5"/>
    <circle cx="880" cy="320" r="1.5"/><circle cx="920" cy="320" r="1.5"/><circle cx="960" cy="320" r="1.5"/>
    <circle cx="1000" cy="320" r="1.5"/><circle cx="1040" cy="320" r="1.5"/><circle cx="1080" cy="320" r="1.5"/>
    <circle cx="1120" cy="320" r="1.5"/><circle cx="1160" cy="320" r="1.5"/>
  </g>

  <!-- ═══ BACKGROUND NEURAL MESH (very subtle) ═══ -->
  <g stroke="#4facfe" stroke-width="0.5" opacity="0.06">
    <line x1="100" y1="60" x2="200" y2="140"/><line x1="200" y1="140" x2="150" y2="260"/>
    <line x1="150" y1="260" x2="50" y2="200"/><line x1="50" y1="200" x2="100" y2="60"/>
    <line x1="1050" y1="60" x2="1150" y2="140"/><line x1="1150" y1="140" x2="1100" y2="270"/>
    <line x1="1100" y1="270" x2="1000" y2="200"/><line x1="1000" y1="200" x2="1050" y2="60"/>
    <line x1="100" y1="60" x2="150" y2="260"/><line x1="1050" y1="60" x2="1100" y2="270"/>
  </g>

  <!-- ═══ FLOATING PARTICLES ═══ -->
  <!-- Cyan particles -->
  <circle cx="120" cy="95" r="2.5" fill="#06b6d4" opacity="0.7" filter="url(#nodeGlow)">
    <animate attributeName="cy" values="95;75;95" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="120" r="2" fill="#06b6d4" opacity="0.6" filter="url(#nodeGlow)">
    <animate attributeName="cy" values="120;100;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="260" r="2" fill="#4facfe" opacity="0.5" filter="url(#nodeGlow)">
    <animate attributeName="cy" values="260;240;260" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="240" r="3" fill="#c084fc" opacity="0.5" filter="url(#nodeGlow)">
    <animate attributeName="cy" values="240;220;240" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ LEFT MINI NEURAL NET ═══ -->
  <g opacity="0.5">
    <circle cx="60" cy="130" r="5" fill="none" stroke="#06b6d4" stroke-width="1.2"/>
    <circle cx="60" cy="170" r="5" fill="none" stroke="#06b6d4" stroke-width="1.2"/>
    <circle cx="60" cy="210" r="5" fill="none" stroke="#06b6d4" stroke-width="1.2"/>
    <circle cx="105" cy="150" r="5" fill="none" stroke="#4facfe" stroke-width="1.2"/>
    <circle cx="105" cy="190" r="5" fill="none" stroke="#4facfe" stroke-width="1.2"/>
    <circle cx="145" cy="170" r="7" fill="#4facfe" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#06b6d4" stroke-width="0.7" opacity="0.5">
      <line x1="65" y1="130" x2="100" y2="150"/>
      <line x1="65" y1="170" x2="100" y2="150"/>
      <line x1="65" y1="170" x2="100" y2="190"/>
      <line x1="65" y1="210" x2="100" y2="190"/>
      <line x1="110" y1="150" x2="138" y2="170"/>
      <line x1="110" y1="190" x2="138" y2="170"/>
    </g>
  </g>

  <!-- ═══ RIGHT BLOCKCHAIN BLOCKS ═══ -->
  <g opacity="0.5">
    <rect x="1030" y="120" width="50" height="35" rx="4" fill="none" stroke="#f9ab00" stroke-width="1.2"/>
    <text x="1055" y="135" text-anchor="middle" fill="#f9ab00" font-size="7" font-family="monospace">#block</text>
    <text x="1055" y="147" text-anchor="middle" fill="#f97316" font-size="6" font-family="monospace">0x1F2A</text>

    <rect x="1090" y="160" width="50" height="35" rx="4" fill="none" stroke="#f9ab00" stroke-width="1.2"/>
    <text x="1115" y="175" text-anchor="middle" fill="#f9ab00" font-size="7" font-family="monospace">#block</text>
    <text x="1115" y="187" text-anchor="middle" fill="#f97316" font-size="6" font-family="monospace">0x3D8C</text>

    <rect x="1030" y="200" width="50" height="35" rx="4" fill="none" stroke="#f9ab00" stroke-width="1.2"/>
    <text x="1055" y="215" text-anchor="middle" fill="#f9ab00" font-size="7" font-family="monospace">#block</text>
    <text x="1055" y="227" text-anchor="middle" fill="#f97316" font-size="6" font-family="monospace">0x9F1E</text>

    <g stroke="#f9ab00" stroke-width="1" stroke-dasharray="3,3" opacity="0.5">
      <line x1="1080" y1="137" x2="1090" y2="160"/>
      <line x1="1090" y1="195" x2="1080" y2="200"/>
      <line x1="1080" y1="155" x2="1080" y2="200" opacity="0"/>
    </g>
  </g>

  <!-- ═══ LOGO ICON (centre-left of text) ═══ -->
  <g transform="translate(460, 100)" filter="url(#nodeGlow)">
    <polygon points="35,2 63,18 63,52 35,68 7,52 7,18" fill="none" stroke="#4facfe" stroke-width="1.5" opacity="0.8"/>
    <polygon points="35,12 53,22 53,48 35,58 17,48 17,22" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.5"/>
    <circle cx="35" cy="35" r="6" fill="#4facfe" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="14" r="3.5" fill="#06b6d4"/>
    <circle cx="55" cy="25" r="3.5" fill="#a855f7"/>
    <circle cx="55" cy="45" r="3.5" fill="#06b6d4"/>
    <circle cx="35" cy="56" r="3.5" fill="#4facfe"/>
    <circle cx="15" cy="45" r="3.5" fill="#a855f7"/>
    <circle cx="15" cy="25" r="3.5" fill="#4facfe"/>
    <g stroke="#4facfe" stroke-width="0.8" opacity="0.6">
      <line x1="35" y1="29" x2="35" y2="17"/>
      <line x1="40" y1="32" x2="52" y2="27"/>
      <line x1="40" y1="38" x2="52" y2="43"/>
      <line x1="35" y1="41" x2="35" y2="53"/>
      <line x1="30" y1="38" x2="18" y2="43"/>
      <line x1="30" y1="32" x2="18" y2="27"/>
    </g>
  </g>

  <!-- ═══ MAIN TITLE TEXT ═══ -->
  <!-- Glow behind text -->
  <text x="600" y="172" text-anchor="middle" font-family="'SF Pro Display', 'Inter', Arial, sans-serif" font-size="88" font-weight="800" fill="#4facfe" opacity="0.08" filter="url(#strongGlow)">NeuroMesh</text>

  <!-- Main text with gradient fill via clip trick -->
  <text x="600" y="172" text-anchor="middle" font-family="'SF Pro Display', 'Inter', Arial, sans-serif" font-size="88" font-weight="800" fill="url(#textGrad)" letter-spacing="-2" filter="url(#textGlow)">NeuroMesh</text>

  <!-- ═══ SUBTITLE ═══ -->
  <text x="600" y="210" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="16" fill="url(#subGrad)" letter-spacing="3">DECENTRALIZED  ·  COGNITIVE  ·  MEMORY  ·  PROTOCOL</text>

  <!-- Divider line under subtitle -->
  <line x1="380" y1="225" x2="820" y2="225" stroke="url(#textGrad)" stroke-width="0.8" opacity="0.3"/>

  <!-- ═══ TAGS ROW ═══ -->
  <!-- Tag 1 -->
  <rect x="348" y="238" width="120" height="26" rx="13" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
  <text x="408" y="255" text-anchor="middle" font-family="monospace" font-size="10" fill="#06b6d4">⛓  Ethereum Sepolia</text>
  <!-- Tag 2 -->
  <rect x="482" y="238" width="100" height="26" rx="13" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
  <text x="532" y="255" text-anchor="middle" font-family="monospace" font-size="10" fill="#a855f7">🧠  AES-256-GCM</text>
  <!-- Tag 3 -->
  <rect x="596" y="238" width="100" height="26" rx="13" fill="none" stroke="#4facfe" stroke-width="1" opacity="0.6"/>
  <text x="646" y="255" text-anchor="middle" font-family="monospace" font-size="10" fill="#4facfe">📦  IPFS / Pinata</text>
  <!-- Tag 4 -->
  <rect x="710" y="238" width="142" height="26" rx="13" fill="none" stroke="#f9ab00" stroke-width="1" opacity="0.6"/>
  <text x="781" y="255" text-anchor="middle" font-family="monospace" font-size="10" fill="#f9ab00">🤖  Xenova Transformers</text>

  <!-- ═══ BOTTOM GLOW LINE ═══ -->
  <line x1="0" y1="338" x2="1200" y2="338" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.25"/>
  <line x1="0" y1="340" x2="1200" y2="340" stroke="url(#textGrad)" stroke-width="0.5" opacity="0.1"/>

  <!-- ═══ CORNER ACCENTS ═══ -->
  <g stroke="#4facfe" stroke-width="1.5" opacity="0.3">
    <path d="M 0,20 L 0,0 L 20,0"/>
    <path d="M 1180,0 L 1200,0 L 1200,20"/>
    <path d="M 0,320 L 0,340 L 20,340"/>
    <path d="M 1180,340 L 1200,340 L 1200,320"/>
  </g>
</svg>
