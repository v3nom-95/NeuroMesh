<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340"
     role="img" aria-labelledby="nmh-t nmh-d" preserveAspectRatio="xMidYMid meet">
  <title id="nmh-t">NeuroMesh</title>
  <desc id="nmh-d">Banner for the NeuroMesh protocol. A layered embedding mesh on the left feeds a chain of Sepolia memory commits on the right. The wordmark NeuroMesh sits in the centre above the tagline "Portable, encrypted, trust-weighted memory for autonomous AI agents" and four badges: Node 22 ESM, Solidity 0.8.24, AES-256-GCM, ethers v6 Sepolia. A footer line reads: testnet only, not audited, no mainnet value.</desc>
  <defs>
    <linearGradient id="nmh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020c1b"/>
      <stop offset="52%" stop-color="#040d21"/>
      <stop offset="100%" stop-color="#03080f"/>
    </linearGradient>
    <linearGradient id="nmh-title" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="820" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="38%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-260 0; 260 0; -260 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="nmh-glowc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nmh-glowv" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="nmh-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.1" fill="#4facfe" fill-opacity="0.10"/>
    </pattern>
    <style>
      .nmh-pulse { animation: nmh-p 3.2s ease-in-out infinite; }
      @keyframes nmh-p { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
      .nmh-flow { stroke-dasharray: 4 7; animation: nmh-f 2.8s linear infinite; }
      @keyframes nmh-f { to { stroke-dashoffset: -22 } }
      @media (prefers-reduced-motion: reduce) { .nmh-pulse, .nmh-flow { animation: none } }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#nmh-bg)"/>
  <rect width="1200" height="340" fill="url(#nmh-dots)"/>
  <ellipse cx="1000" cy="52" rx="300" ry="190" fill="url(#nmh-glowc)"/>
  <ellipse cx="220" cy="308" rx="340" ry="180" fill="url(#nmh-glowv)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" fill="none" stroke="#1e293b" stroke-width="1"/>

  <g>
  <text x="58" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="1.2" fill="#94a3b8">384d / 768d EMBEDDINGS</text>
    <g stroke="#4facfe" stroke-width="0.7" stroke-opacity="0.30">
      <line x1="75" y1="112" x2="135" y2="135"/>
      <line x1="75" y1="112" x2="135" y2="181"/>
      <line x1="75" y1="112" x2="135" y2="227"/>
      <line x1="75" y1="158" x2="135" y2="135"/>
      <line x1="75" y1="158" x2="135" y2="181"/>
      <line x1="75" y1="158" x2="135" y2="227"/>
      <line x1="75" y1="204" x2="135" y2="135"/>
      <line x1="75" y1="204" x2="135" y2="181"/>
      <line x1="75" y1="204" x2="135" y2="227"/>
      <line x1="75" y1="250" x2="135" y2="135"/>
      <line x1="75" y1="250" x2="135" y2="181"/>
      <line x1="75" y1="250" x2="135" y2="227"/>
      <line x1="145" y1="135" x2="200" y2="158"/>
      <line x1="145" y1="135" x2="200" y2="204"/>
      <line x1="145" y1="181" x2="200" y2="158"/>
      <line x1="145" y1="181" x2="200" y2="204"/>
      <line x1="145" y1="227" x2="200" y2="158"/>
      <line x1="145" y1="227" x2="200" y2="204"/>
    </g>
    <circle cx="70" cy="112" r="4.5" fill="none" stroke="#4facfe" stroke-width="1.4"/>
    <circle cx="70" cy="158" r="4.5" fill="none" stroke="#4facfe" stroke-width="1.4" class="nmh-pulse"/>
    <circle cx="70" cy="204" r="4.5" fill="none" stroke="#4facfe" stroke-width="1.4"/>
    <circle cx="70" cy="250" r="4.5" fill="none" stroke="#4facfe" stroke-width="1.4" class="nmh-pulse"/>
    <circle cx="140" cy="135" r="4.5" fill="none" stroke="#06b6d4" stroke-width="1.4"/>
    <circle cx="140" cy="181" r="4.5" fill="none" stroke="#06b6d4" stroke-width="1.4" class="nmh-pulse"/>
    <circle cx="140" cy="227" r="4.5" fill="none" stroke="#06b6d4" stroke-width="1.4"/>
    <circle cx="206" cy="158" r="6" fill="#a855f7" stroke="#a855f7" stroke-width="1.4"/>
    <circle cx="206" cy="204" r="6" fill="#a855f7" stroke="#a855f7" stroke-width="1.4"/>
  </g>

  <g>
  <text x="968" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="1.2" fill="#94a3b8">SEPOLIA COMMITS</text>
    <rect x="968" y="88" width="164" height="46" rx="8" fill="#0b1220" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.75"/>
    <text x="982" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#f59e0b" fill-opacity="0.95">QmXv4cAQ&#8230;</text>
    <text x="982" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#94a3b8">MemoryLedger</text>
    <line class="nmh-flow" x1="1050" y1="134" x2="1050" y2="152" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
    <rect x="968" y="152" width="164" height="46" rx="8" fill="#0b1220" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.75"/>
    <text x="982" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#f59e0b" fill-opacity="0.95">QmTTRfBa&#8230;</text>
    <text x="982" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#94a3b8">MemoryLedger</text>
    <line class="nmh-flow" x1="1050" y1="198" x2="1050" y2="216" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
    <rect x="968" y="216" width="164" height="46" rx="8" fill="#0b1220" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.75"/>
    <text x="982" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#f59e0b" fill-opacity="0.95">QmVaKCrp&#8230;</text>
    <text x="982" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#94a3b8">MemoryLedger</text>
  </g>

  <text x="600" y="106" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="3.4" fill="#06b6d4" fill-opacity="0.9">COGNITIVE MEMORY PROTOCOL &#183; v2.0.0</text>
  <text x="600" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="url(#nmh-title)">NeuroMesh</text>
  <text x="600" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#cbd5e1">Portable, encrypted, trust-weighted memory for autonomous AI agents</text>
  <rect x="327" y="240" width="118" height="26" rx="13" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.55"/>
  <text x="386" y="257" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#34d399" fill-opacity="0.95">Node 22 &#183; ESM</text>
  <rect x="457" y="240" width="126" height="26" rx="13" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.55"/>
  <text x="520" y="257" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#f59e0b" fill-opacity="0.95">Solidity 0.8.24</text>
  <rect x="595" y="240" width="116" height="26" rx="13" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.55"/>
  <text x="653" y="257" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#a855f7" fill-opacity="0.95">AES-256-GCM</text>
  <rect x="723" y="240" width="150" height="26" rx="13" fill="none" stroke="#4facfe" stroke-width="1" stroke-opacity="0.55"/>
  <text x="798" y="257" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#4facfe" fill-opacity="0.95">ethers v6 &#183; Sepolia</text>
  <text x="600" y="308" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#64748b">testnet only &#183; not audited &#183; no mainnet value</text>

