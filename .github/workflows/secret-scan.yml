# ---------------------------------------------------------------------------
# Secret scanning.
#
# This repository asks contributors to put a funded Sepolia PRIVATE_KEY and a
# Pinata JWT in a local .env. That makes an accidental commit of a credential
# the single most damaging mistake anyone can make here, so it is checked on
# every push and every pull request, over full history, from two directions:
#
#   1. gitleaks - pattern-based scan of the diff (PR) or the whole repo (push).
#   2. an explicit git-history assertion that no .env file has EVER existed in
#      any commit on any ref. gitleaks can miss a credential whose shape it
#      does not know; the filename check cannot.
#
# Config: .github/gitleaks.toml (allowlists the placeholder values in
# .env.example so the template never trips the scanner).
# gitleaks-action@v2 is free for personal accounts and public repositories;
# an organization-owned private repo additionally needs a GITLEAKS_LICENSE
# secret, which this workflow deliberately does not require today.
# ---------------------------------------------------------------------------
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still a leak.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

      - name: Assert no .env file has ever been committed
        run: |
          hits="$(git log --all --full-history --name-only --pretty=format: -- '.env' '.env.*' ':!:.env.example' | sort -u | sed '/^$/d')"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A .env file exists somewhere in git history. Rotate PRIVATE_KEY and PINATA_JWT immediately, then purge history with git filter-repo."
            exit 1
          fi
          echo "No .env in history."

      - name: Assert .gitignore still ignores .env
        run: |
          if ! git check-ignore -q .env.local; then
            echo "::error::.gitignore no longer ignores .env files. Restore the '.env' / '.env.*' rules."
            exit 1
          fi
          if git check-ignore -q .env.example; then
            echo "::error::.env.example is being ignored. The '!.env.example' negation is missing from .gitignore."
            exit 1
          fi
          echo ".gitignore rules are intact."
