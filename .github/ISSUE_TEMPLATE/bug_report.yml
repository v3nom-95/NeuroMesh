name: Bug report
description: Report a defect in the protocol, backend API, or dashboard
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        **Do not paste private keys, Pinata JWTs, RPC URLs containing an API key, or the contents of your `.env`.**
        Redact them before you submit - GitHub issues are public and permanent.

        **If this is a security vulnerability, stop.** Do not file a public issue.
        Follow [SECURITY.md](https://github.com/v3nom-95/NeuroMesh/blob/main/SECURITY.md)
        and open a [private security advisory](https://github.com/v3nom-95/NeuroMesh/security/advisories/new) instead.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Where does the defect show up?
      options:
        - Smart contracts
        - Backend API
        - Dashboard / frontend
        - Encryption / semantic sync
        - Deployment / Docker
        - CI / tooling
        - Documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit SHA
      description: Output of `git rev-parse --short HEAD`, or the release tag.
      placeholder: "v2.0.0 or c7e3cfb"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behaviour. Include the exact error message and stack trace, with all secrets redacted.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A reviewer must be able to follow these on a clean clone.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      render: markdown
      value: |
        - OS:
        - Node (`node -v`):
        - npm (`npm -v`):
        - Install method: local / Docker / docker compose
        - Network: hardhat / localhost / sepolia
        - Embedding provider (`NEUROMESH_EMBEDDING_PROVIDER`): local / mock
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server output, browser console, or `docker logs`. Secrets redacted.
      render: shell

  - type: checkboxes
    id: hygiene
    attributes:
      label: Confirmations
      options:
        - label: I have redacted every private key, JWT, and API key from this report
          required: true
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am running Node 20 or newer
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md, privately)
          required: true
